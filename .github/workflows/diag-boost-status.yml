name: pulso-transmi-diag-boost-status

# Utilitario puntual (2026-10-03): 07107/02300/05100 sobre-predicen
# sistemáticamente en producción — ¿el boost reactivo ya existente
# (ver compute_fast_boost/boost_validated_stations en train.py) las
# está cubriendo, o se están quedando afuera de esa protección? Solo
# workflow_dispatch, nunca corre solo, no escribe nada.
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Chequear cobertura del boost para las estaciones problema
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m scripts.diag_boost_status
