name: pulso-transmi-diag-data-sanity

# Utilitario puntual (2026-10-03): el usuario preguntó si el
# entrenamiento está usando datos correctos (no stale, sin fuga, sin
# que haya pasado algo raro como antes). Este workflow chequea
# frescura/completitud/duplicados de `observacion` y mira de cerca la
# serie reciente de 05100 (la estación que reventó el último
# candidato) para distinguir un movimiento real de demanda de un
# problema de datos. Solo workflow_dispatch, nunca corre solo, no
# escribe nada.
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Chequear sanidad de observacion y serie reciente de 05100
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m scripts.diag_data_sanity
