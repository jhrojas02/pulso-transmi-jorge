name: pulso-transmi-train

on:
  schedule:
    - cron: "0 */6 * * *"  # cada 6h: baja el peor caso de reacción al drift sin comparar contra ruido de corto plazo
  workflow_dispatch:

concurrency:
  group: pulso-transmi-train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # Subido de 20 a 35 (2026-10-01): el tercer candidato de GBM
    # (sklearn-MAE, ver gbm_candidate_mae en train.py) agrega ~50% más
    # entrenamientos por horizonte (3 tipos x2 evaluaciones en vez de 2) —
    # una corrida real tras agregarlo tardó más de 20 min y arriesgaba que
    # GitHub Actions la matara a mitad de camino, perdiendo el trabajo
    # completo (y el drift sigue sin detenerse mientras tanto).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Entrenar candidato y promover si supera al champion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Reactivada 2026-09-30: Supabase REST/Storage devuelve 402 (cuota
          # de Cached Egress agotada hasta el 17 de octubre) — DATABASE_URL
          # ahora apunta a la conexión directa a Postgres de la MISMA base
          # de Supabase (no Neon), que no cuenta contra esa cuota. Los
          # modelos champion ya se migraron a model_blob (ver
          # migrate-model-blob.yml). Ver docs/plan-b-postgres.md.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_SHA: ${{ github.sha }}
        run: python -m src.pipeline.promote
