name: pulso-transmi-train

on:
  schedule:
    - cron: "0 */6 * * *"  # cada 6h: baja el peor caso de reacción al drift sin comparar contra ruido de corto plazo
  workflow_dispatch:

concurrency:
  group: pulso-transmi-train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Subido de 35 a 60 (2026-10-02): train.py ahora reentrena el modelo
    # final UNA VEZ MÁS antes de guardarlo (con TODOS los datos, no solo
    # full_train_df — ver docstring del "Reentreno final para DESPLIEGUE"
    # en run()), para que el artefacto desplegado sí vea la semana más
    # reciente en vez de dejarla siempre afuera como test. Esto
    # prácticamente DUPLICA el entrenamiento del Paso 2 (los 4 candidatos
    # de GBM se entrenan 2 veces por horizonte en vez de 1) — la corrida
    # anterior con 4 candidatos (sin este reentreno) tardaba ~10-13 min,
    # así que 60 min deja margen generoso incluso si el doble de
    # entrenamiento la acerca a 25-30 min reales.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Asegurar que exista el bucket "models" en Storage
        # Proyecto de Supabase nuevo (2026-10-02, el original quedó
        # restringido por cuota — ver docs/plan-b-postgres.md): Storage
        # arranca sin buckets, y storage_upload() fallaría la primera vez
        # que promote.py intente subir un modelo. Crear el bucket acá
        # (idempotente — 200 si no existía, 409 "already exists" si ya
        # estaba, ambos están bien) evita perder una corrida entera de
        # entrenamiento por algo que se arregla en un segundo.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          curl -sS -o /tmp/bucket_resp.json -w "%{http_code}" \
            -X POST "$SUPABASE_URL/storage/v1/bucket" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"name":"models","public":false}' > /tmp/bucket_status.txt
          status=$(cat /tmp/bucket_status.txt)
          echo "status=$status"; cat /tmp/bucket_resp.json; echo
          # Supabase devuelve el "ya existe" como HTTP 400 (no 409) con
          # {"statusCode":"409",...,"code":"BucketAlreadyExists"} en el body
          # (confirmado en producción 2026-10-02: tiró un run entero de
          # train.yml en 1 minuto, antes de entrenar nada, por chequear
          # solo el código HTTP crudo sin mirar el body) — se trata igual
          # como éxito si el body confirma que es justamente ese caso.
          if [ "$status" != "200" ] && [ "$status" != "409" ] && ! grep -q "BucketAlreadyExists" /tmp/bucket_resp.json; then
            echo "::error::No se pudo crear/confirmar el bucket 'models' (HTTP $status)"
            exit 1
          fi
      - name: Entrenar candidato y promover si supera al champion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # DATABASE_URL se dejó de usar (2026-10-02): la conexión directa a
          # Postgres del proyecto nuevo se colgó 3 veces en distintos
          # puntos (ver historial del commit) sin que ningún timeout lo
          # arreglara del todo — volvió a la REST API normal de Supabase
          # (más probada, con timeouts por request ya establecidos). Si el
          # secret DATABASE_URL sigue configurado igual, supabase_client.py
          # lo usaría en vez de REST — se espera que esté vacío/borrado.
          GITHUB_SHA: ${{ github.sha }}
        # timeout explícito (2026-10-02): el proceso se colgó 2 veces sin
        # ningún traceback (una query a Postgres que nunca respondía ni
        # fallaba) y se comió el timeout-minutes completo del job las dos
        # veces. `timeout` de coreutils mata el proceso a los 35 min pase
        # lo que pase, así el job falla rápido y con una señal clara en
        # vez de agotar el límite del workflow entero en silencio.
        run: timeout 2100 python -m src.pipeline.promote
