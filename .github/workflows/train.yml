name: pulso-transmi-train

on:
  schedule:
    - cron: "0 */6 * * *"  # cada 6h: baja el peor caso de reacción al drift sin comparar contra ruido de corto plazo
  workflow_dispatch:

concurrency:
  group: pulso-transmi-train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Subido de 35 a 60 (2026-10-02): train.py ahora reentrena el modelo
    # final UNA VEZ MÁS antes de guardarlo (con TODOS los datos, no solo
    # full_train_df — ver docstring del "Reentreno final para DESPLIEGUE"
    # en run()), para que el artefacto desplegado sí vea la semana más
    # reciente en vez de dejarla siempre afuera como test. Esto
    # prácticamente DUPLICA el entrenamiento del Paso 2 (los 4 candidatos
    # de GBM se entrenan 2 veces por horizonte en vez de 1) — la corrida
    # anterior con 4 candidatos (sin este reentreno) tardaba ~10-13 min,
    # así que 60 min deja margen generoso incluso si el doble de
    # entrenamiento la acerca a 25-30 min reales.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Entrenar candidato y promover si supera al champion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Reactivada 2026-09-30: Supabase REST/Storage devuelve 402 (cuota
          # de Cached Egress agotada hasta el 17 de octubre) — DATABASE_URL
          # ahora apunta a la conexión directa a Postgres de la MISMA base
          # de Supabase (no Neon), que no cuenta contra esa cuota. Los
          # modelos champion ya se migraron a model_blob (ver
          # migrate-model-blob.yml). Ver docs/plan-b-postgres.md.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_SHA: ${{ github.sha }}
        # timeout explícito (2026-10-02): el proceso se colgó 2 veces sin
        # ningún traceback (una query a Postgres que nunca respondía ni
        # fallaba) y se comió el timeout-minutes completo del job las dos
        # veces. `timeout` de coreutils mata el proceso a los 35 min pase
        # lo que pase, así el job falla rápido y con una señal clara en
        # vez de agotar el límite del workflow entero en silencio.
        run: timeout 2100 python -m src.pipeline.promote
